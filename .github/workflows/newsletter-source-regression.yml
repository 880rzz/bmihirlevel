name: Newsletter source regression
on:
  pull_request:
    paths:
      - index.html
      - de/**
      - en/**
      - exports/**
      - robots.txt
      - sitemap.xml
      - scripts/check_newsletter_contract.py
      - scripts/check_production_images.py
      - .github/workflows/check-newsletter-production.yml
      - .github/workflows/newsletter-source-regression.yml
  push:
    branches: [main]
    paths:
      - index.html
      - de/**
      - en/**
      - exports/**
      - scripts/check_newsletter_contract.py
      - .github/workflows/newsletter-source-regression.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax-check production smoke test
        run: python -m py_compile scripts/check_production_images.py
      - name: Verify newsletter source contract
        run: python scripts/check_newsletter_contract.py
