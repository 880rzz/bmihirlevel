name: Import October newsletter OG
on:
  push:
    branches:
      - steward/replace-og-1200x630
    paths:
      - .github/workflows/import-october-og.yml

permissions:
  contents: write

jobs:
  import-og:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: steward/replace-og-1200x630
          fetch-depth: 0

      - name: Download canonical 1200x630 OG image
        run: |
          mkdir -p assets/og
          curl --fail --location --retry 3             "https://static.wixstatic.com/media/b0aee1_8a9c977e887f469689d4617ec4c8afbf~mv2.jpg"             --output assets/og/2026-10-01.jpg

      - name: Verify image dimensions
        run: |
          python - <<'PY'
          from PIL import Image
          p='assets/og/2026-10-01.jpg'
          im=Image.open(p)
          assert im.size == (1200, 630), f"Unexpected OG dimensions: {im.size}"
          print("Verified", im.size)
          PY

      - name: Update OG metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['index.html','archive/2026-10-01.html']:
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              s=s.replace('<meta property="og:image:width" content="400">','<meta property="og:image:width" content="1200">')
              s=s.replace('<meta property="og:image:height" content="210">','<meta property="og:image:height" content="630">')
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit imported OG asset
        run: |
          git config user.name "BMI Newsletter Steward"
          git config user.email "actions@users.noreply.github.com"
          git add assets/og/2026-10-01.jpg index.html archive/2026-10-01.html
          git diff --cached --quiet && exit 0
          git commit -m "Replace October newsletter OG with 1200x630 image [skip ci]"
          git push origin HEAD:steward/replace-og-1200x630
